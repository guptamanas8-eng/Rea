<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#14161a">
<title>Play on the TV</title>
<style>
  :root { --bg:#14161a; --panel:#1f232a; --key:#2b3039; --fg:#eef1f5; --dim:#9aa3b2; --accent:#4f8cff; --ok:#43a047; --bad:#ff6b6b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.4 system-ui, sans-serif; }
  body { padding:14px 16px 24px; max-width:520px; margin:0 auto; }
  h1 { font-size:22px; margin:6px 0 14px; }
  .me { display:flex; align-items:center; gap:8px; color:var(--dim); font-size:14px; margin-bottom:12px; }
  .me .dot { width:12px; height:12px; border-radius:50%; } .me b { color:var(--fg); }
  .me .score { margin-left:auto; color:var(--fg); font-weight:700; }
  .card { background:var(--panel); border-radius:14px; padding:16px; margin:10px 0; }
  .center { text-align:center; } .dim { color:var(--dim); }
  .word { font-size:34px; font-weight:800; letter-spacing:1px; text-align:center; margin:4px 0; }
  .hint { font-family:ui-monospace, monospace; font-size:26px; letter-spacing:4px; text-align:center; }
  input[type=text] { width:100%; padding:14px; border-radius:12px; border:1px solid #333a45; background:var(--panel); color:var(--fg); font-size:18px; }
  button { border:0; border-radius:12px; background:var(--key); color:var(--fg); font-size:16px; padding:14px; touch-action:manipulation; }
  button.primary { background:var(--accent); color:#fff; font-weight:700; }
  button:disabled { opacity:.45; }
  .row { display:flex; gap:8px; margin:8px 0; } .row > * { flex:1; }
  .send { display:flex; gap:8px; } .send input { flex:1; } .send button { flex:0 0 auto; }
  .opts { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .opts button { min-height:110px; font-size:18px; font-weight:700; color:#fff; padding:10px; }
  .opts button.picked { outline:4px solid #fff; } .opts button.faded { opacity:.3; }
  .opts button.picked:disabled { opacity:1; }
  canvas { display:block; width:100%; aspect-ratio:16/9; border-radius:10px; background:#fff; touch-action:none; }
  .swatches { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
  .swatches button { width:34px; height:34px; padding:0; border-radius:50%; border:3px solid transparent; }
  .swatches button.on { border-color:var(--fg); }
  .log div { padding:4px 0; color:var(--dim); } .log .close { color:#ffd166; } .log .correct { color:#7fe08a; font-weight:700; }
  .timer { float:right; font-weight:800; font-variant-numeric:tabular-nums; }
  .scores div { display:flex; gap:8px; padding:4px 0; } .scores span:last-child { margin-left:auto; }
  .pad { display:grid; grid-template-columns:1fr 1fr; gap:10px; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  .pad button { min-height:120px; font-size:22px; font-weight:800; touch-action:none; user-select:none; -webkit-user-select:none; }
  .pad button.held { filter:brightness(1.5); transform:scale(.97); }
  .pad .gas { background:#2e7d32; } .pad .brake { background:#8e2a2a; } .pad .hit { background:#6a1b9a; min-height:84px; }
  .racehud { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
  .racehud .pos { font-size:34px; font-weight:900; color:#ffeb3b; } .racehud .meta { color:var(--dim); }
  .racehud .spd { margin-left:auto; font-weight:800; }
  .hbar { height:10px; border-radius:5px; background:#333; margin-top:8px; overflow:hidden; } .hbar div { height:100%; background:#66bb6a; }
  .toot { position:relative; width:100%; min-height:220px; border-radius:24px; font-size:24px; font-weight:900; color:#fff; touch-action:none;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; overflow:hidden; }
  .toot .fill { position:absolute; left:0; bottom:0; width:100%; height:0; background:rgba(255,255,255,.28); pointer-events:none; }
  .toot span { position:relative; pointer-events:none; }
  .toots { display:flex; gap:10px; } .toots > * { flex:1; }
  .gas { height:12px; border-radius:6px; background:#333; overflow:hidden; margin-top:6px; } .gas div { height:100%; }
  label.auto { display:flex; align-items:center; gap:8px; color:var(--dim); font-size:15px; margin:8px 0; }
  #toast { position:fixed; left:16px; right:16px; bottom:14px; max-width:488px; margin:0 auto; padding:12px; border-radius:12px; background:#2b3039; text-align:center; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<div id="app"><h1>Connecting…</h1></div>
<div id="toast"></div>
<script>
const OPT_COLORS = ['#e53935', '#1e88e5', '#f9a825', '#43a047'];
const COLORS = ['#111111', '#e53935', '#fb8c00', '#fdd835', '#43a047', '#1e88e5', '#8e24aa', '#6d4c41'];
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} } };
let token = store.get('tvgame-token'), view = null, es = null, myLog = [], lastKey = '';
let pen = { color: COLORS[0], width: 10 };

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {

}
let toastT;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.className = 'show'; clearTimeout(toastT); toastT = setTimeout(() => t.className = '', 2200); }
function buzz(ms) { if (navigator.vibrate) navigator.vibrate(ms); }
async function post(path, body) {
  try {
    const r = await fetch('/api/game/' + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: token, ...body }) });
    const j = await r.json();
    if (r.status === 403 && path !== 'join') { store.set('tvgame-token', null); token = null; connect(); }
    if (!r.ok || j.ok === false) toast(j.error || j.out || 'Something went wrong');
    return j;
  } catch (e) { toast('Lost contact with the game'); return {}; }
}

function connect() {
  if (es) es.close();
  es = new EventSource('/api/game/events' + (token ? '?t=' + encodeURIComponent(token) : ''));
  es.onmessage = m => {
    const ev = JSON.parse(m.data);
    if (ev.type === 'view') { view = ev.view; if (token && ev.view.you === null) { token = null; store.set('tvgame-token', null); } render(); }
  };
  es.onerror = () => { const a = document.getElementById('app'); if (!view) a.replaceChildren(h('h1', {}, 'Can\'t reach the game. Same Wi-Fi as the TV?')); };
}

function joinScreen() {
  const name = h('input', { type: 'text', maxlength: 16, placeholder: 'Your name', value: store.get('tvgame-name') || '', autocomplete: 'off' });
  const go = async () => {
    const n = name.value.trim(); if (!n) return toast('Type your name');
    const j = await post('join', { name: n });
    if (j.token) { token = j.token; store.set('tvgame-token', token); store.set('tvgame-name', n); buzz(30); connect(); }
  };
  name.onkeydown = e => { if (e.key === 'Enter') go(); };
  return [h('h1', {}, { quiz: '⚡ Quiz Buzzer', race: '🏍️ Highway Brawl', boat: '💨 Toot Boat' }[view && view.mode] || '✏️ Draw & Guess'),
    view && view.phase === 'idle' ? h('div', { class: 'card dim' }, 'No game is open yet. Ask the host to pick one.') :
    h('div', { class: 'card' }, h('div', { class: 'send' }, name, h('button', { class: 'primary', onclick: go }, 'Join')))];
}

function scores(v) {
  return h('div', { class: 'card scores' }, h('div', { class: 'dim' }, 'Scores'),
    v.players.map(p => h('div', {}, h('span', { style: 'color:' + p.color }, '●'), h('span', {}, p.name + (p.id === v.you.id ? ' (you)' : '')), h('span', {}, p.score))));
}

let pad = null;
function makePad(canDraw, initial) {

    if (pts.length === 1) { ctx.beginPath(); ctx.arc(pts[0][0] * cv.width, pts[0][1] * cv.height, s.width * sc / 2, 0, 7); ctx.fill(); return; }
    ctx.beginPath(); const a = Math.max(0, from - 1); ctx.moveTo(pts[a][0] * cv.width, pts[a][1] * cv.height);

  p.redraw = () => { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); p.strokes.forEach(s => p.seg(s, 0)); };

    const pt = e => { const r = cv.getBoundingClientRect(); return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))].map(v => +v.toFixed(4)); };
    const flush = () => { p.timer = null; if (!p.cur || !p.pending.length) return; const pts = p.pending; p.pending = [];
      post('draw', { id: p.cur.id, color: p.cur.color, width: p.cur.width, points: pts }); };

      p.cur = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), color: pen.color, width: pen.width, points: [pt(e)] };

function render() {

  const me = h('div', { class: 'me' }, h('span', { class: 'dot', style: 'background:' + v.you.color }), 'Playing as ', h('b', {}, v.you.name),
    h('span', { class: 'score' }, v.you.score + ' pts'));

    const hint = document.querySelector('.hint'); if (hint && v.draw && !v.draw.you_draw) hint.textContent = v.draw.hint;
    const s = document.querySelector('.scorebox'); if (s) s.replaceChildren(scores(v));
    const rh = document.querySelector('.racehud-box'); if (rh && v.race) rh.replaceChildren(raceHud(v.race.hud));
    const bh = document.querySelector('.boathud-box'); if (bh && v.boat) bh.replaceChildren(boatHud(v.boat.hud, v.you.id));
    const m = document.querySelector('.me'); if (m) m.replaceWith(me);

  }
  const newTurn = key.split('|').slice(0, 3).join('|') !== lastKey.split('|').slice(0, 3).join('|');
  lastKey = key;
  if (newTurn) myLog = [];

  if (v.phase === 'lobby') {
    app.replaceChildren(me, h('div', { class: 'card center' }, h('h1', {}, 'You\'re in! 🎉'),
      h('div', { class: 'dim' }, `Waiting for the host to start ${{ draw: 'Draw & Guess', quiz: 'the quiz', race: 'the race', boat: 'the boat trip' }[v.mode]}…`)), h('div', { class: 'scorebox' }, scores(v)),
      h('button', { onclick: () => { if (confirm('Leave the game?')) post('leave', {}).then(() => { token = null; store.set('tvgame-token', null); connect(); }); } }, 'Leave'));
    return;
  }
  if (v.phase === 'over') {
    const rank = v.players.findIndex(p => p.id === v.you.id) + 1;
    buzz([60, 60, 60]);
    app.replaceChildren(me, h('div', { class: 'card center' }, h('h1', {}, rank === 1 ? '🏆 You won!' : `You came #${rank}`),
      h('div', { class: 'dim' }, 'The host can start another round.')), scores(v));
    return;
  }
  if (v.mode === 'draw') {
    const d = v.draw;
    if (v.phase === 'reveal') {
      const got = d.points[v.you.id];
      app.replaceChildren(me, h('div', { class: 'card center' }, h('div', { class: 'dim' }, 'The word was'), h('div', { class: 'word' }, (d.word || '').toUpperCase()),
        got ? h('div', { style: 'color:#7fe08a;font-weight:700' }, `+${got} points`) : null), h('div', { class: 'scorebox' }, scores(v)));
      return;
    }
    if (d.you_draw) {
      buzz(200);
      pad = makePad(true, []);
      const sw = h('div', { class: 'swatches' }, COLORS.map(c => h('button', { class: c === pen.color ? 'on' : '', style: 'background:' + c,
        onclick: e => { pen.color = c; sw.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === e.currentTarget)); } })));
      const sizes = h('div', { class: 'row' }, [['Thin', 5], ['Medium', 10], ['Thick', 22]].map(([n, w]) =>
        h('button', { class: w === pen.width ? 'primary' : '', onclick: e => { pen.width = w; sizes.querySelectorAll('button').forEach(b => b.className = b === e.currentTarget ? 'primary' : ''); } }, n)));
      app.replaceChildren(me,
        h('div', { class: 'card' }, timer, h('div', { class: 'dim' }, 'Draw this (don\'t write the word!):'), h('div', { class: 'word' }, d.word.toUpperCase())),
        pad.cv, sw, sizes,
        h('div', { class: 'row' },
          h('button', { onclick: () => { pad.strokes.pop(); pad.redraw(); post('draw/edit', { action: 'undo' }); } }, '↶ Undo'),
          h('button', { onclick: () => { pad.strokes = []; pad.redraw(); post('draw/edit', { action: 'clear' }); } }, 'Clear'),
          h('button', { disabled: !d.skips_left, onclick: () => post('draw/edit', { action: 'skip' }) }, `New word (${d.skips_left})`)),
        h('div', { class: 'scorebox' }, scores(v)));
      return;
    }
    // guesser: the drawing is on the TV
    pad = null;
    const input = h('input', { type: 'text', placeholder: d.you_guessed ? 'You got it! 🎉' : 'Type your guess', disabled: d.you_guessed, autocomplete: 'off', autocapitalize: 'none' });
    const log = h('div', { class: 'log' });
    const showLog = () => log.replaceChildren(...myLog.slice(-5).reverse().map(l => h('div', { class: l.kind }, l.text)));
    const send = async () => {
      const g = input.value.trim(); if (!g) return; input.value = '';
      const j = await post('guess', { text: g });
      if (j.result === 'correct') { buzz([40, 40, 120]); myLog.push({ kind: 'correct', text: `✔ ${g}: correct! +${j.points}` }); }
      else if (j.result === 'close') myLog.push({ kind: 'close', text: `${g}: so close!` });
      else if (j.result === 'wrong') myLog.push({ kind: '', text: `${g}: no` });
      showLog();
    };
    input.onkeydown = e => { if (e.key === 'Enter') send(); };
    showLog();
    app.replaceChildren(me,
      h('div', { class: 'card' }, timer, h('div', { class: 'dim' }, `${d.drawer} is drawing. Watch the TV!`), h('div', { class: 'hint' }, d.hint)),
      h('div', { class: 'send' }, input, h('button', { class: 'primary', disabled: d.you_guessed, onclick: send }, 'Guess')),
      h('div', { class: 'card log' }, log),
      h('div', { class: 'scorebox' }, scores(v)));

    return;
  }
  if (v.mode === 'boat' && v.phase === 'boat') {
    if (!v.boat.aboard) {
      app.replaceChildren(me, h('div', { class: 'card center' }, h('h1', {}, 'Boat trip in progress'), h('div', { class: 'dim' }, 'You joined after the start. Watch the TV, you\'re on the next trip!')));
      return;

    app.replaceChildren(me, h('div', { class: 'card boathud-box' }, boatHud(v.boat.hud, v.you.id)),

      h('div', { class: 'dim', style: 'font-size:14px;margin-top:10px' }, where, ' Hold longer for a bigger toot. Beans refill your gas.'));
    return;

      return;

      h('div', { class: 'dim', style: 'font-size:13px;margin-top:10px' }, 'Hold ◀ ▶ to steer and GAS to go. Punch or kick riders right next to you. Off the road is slow, and hitting trees or cars crashes you.'));
    return;
  }
  if (v.mode === 'quiz') {
    const q = v.quiz, reveal = v.phase === 'reveal', picked = q.your_choice;
    if (!reveal && picked == null && newTurn) buzz(60);
    const opts = h('div', { class: 'opts' }, q.options.map((o, i) => h('button', {
      style: 'background:' + OPT_COLORS[i],
      class: reveal ? (i === q.answer ? 'picked' : 'faded') : (picked === i ? 'picked' : picked != null ? 'faded' : ''),

      onclick: () => post('answer', { choice: i }).then(j => j.ok && buzz(20)) }, 'ABCD'[i] + '  ' + o)));

    } else status = h('div', { class: 'dim' }, picked != null ? 'Locked in. Waiting for the others…' : 'Tap your answer, faster scores more!');

      h('div', { style: 'font-size:20px;font-weight:700;margin-top:6px' }, q.question)), opts, h('div', { class: 'card center' }, status), h('div', { class: 'scorebox' }, scores(v)));
  }
}
function raceHud(hd) {

  return h('div', {}, h('div', { class: 'racehud' }, h('span', { class: 'pos' }, ordinal(hd.pos)), h('span', { class: 'meta' }, `of ${hd.of} · lap ${hd.lap}/${hd.laps}`),
    h('span', { class: 'spd' }, hd.speed + ' km/h')),
    h('div', { class: 'hbar' }, h('div', { style: `width:${hd.health}%;background:${hd.health > 50 ? '#66bb6a' : hd.health > 25 ? '#ffca28' : '#ef5350'}` })),
    status ? h('div', { style: 'margin-top:8px;font-weight:700' }, status) : null);
}
function ordinal(n) { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

function boatHud(hd, myId) {
  if (!hd || !hd.seats) return h('div', { class: 'dim' }, 'Get ready…');
  const mine = hd.seats.filter(s => s.owner === myId), mm = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  return h('div', {}, h('div', { class: 'racehud' }, h('span', { class: 'pos', style: 'font-size:26px' }, Math.round(hd.progress * 100) + '%'),
      h('span', { class: 'meta' }, 'of the river'), h('span', { class: 'spd' }, `${mm(hd.time)} · ★ ${hd.stars}`)),
    mine.map(s => h('div', { class: 'gas' }, h('div', { style: `width:${Math.round(s.gas * 100)}%;background:${s.gas > 0.25 ? '#9ccc65' : '#ef5350'}` }))),
    hd.status === 'countdown' ? h('div', { style: 'margin-top:8px;font-weight:700' }, 'Get ready…') : null);
}
// hold to charge (up to a second), release to toot; the phone plays its own toot too
let tootAudio = null;
function phoneToot(p) {
  try {
    tootAudio = tootAudio || new (window.AudioContext || window.webkitAudioContext)();
    const a = tootAudio, t0 = a.currentTime, dur = 0.15 + p * 0.45, base = 80 + Math.random() * 40;
    const o = a.createOscillator(), g = a.createGain(), f = a.createBiquadFilter(), l = a.createOscillator(), lg = a.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(base * 1.4, t0); o.frequency.exponentialRampToValueAtTime(base * 0.7, t0 + dur);
    l.frequency.value = 20 + Math.random() * 12; lg.gain.value = base * 0.35; l.connect(lg); lg.connect(o.frequency);
    f.type = 'lowpass'; f.frequency.value = 650 + p * 450; f.Q.value = 6;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.4, t0 + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(f); f.connect(g); g.connect(a.destination); o.start(t0); l.start(t0); o.stop(t0 + dur + 0.05); l.stop(t0 + dur + 0.05);
  } catch (e) {}
}
function tootButton(text, seat, color) {
  const fill = h('div', { class: 'fill' }), b = h('button', { class: 'toot', style: 'background:' + color }, fill, h('span', {}, text));
  let t0 = 0, timer = null;
  const grow = () => { const p = Math.min(1, (performance.now() - t0) / 1000); fill.style.height = (p * 100) + '%'; if (t0) timer = requestAnimationFrame(grow); };
  b.onpointerdown = e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (err) {} t0 = performance.now(); buzz(10); grow(); };
  const release = () => {
    if (!t0) return;
    const p = Math.min(1, (performance.now() - t0) / 1000); t0 = 0; cancelAnimationFrame(timer); fill.style.height = '0';
    phoneToot(Math.max(0.25, p)); buzz(30 + p * 120); post('boat/toot', { seat, power: Math.max(0.25, p) });
  };
  b.onpointerup = release; b.onpointercancel = release; b.oncontextmenu = e => e.preventDefault();
  return b;
}

// controls are sent only when a button changes, not every frame
const ctl = { l: false, r: false, gas: false, brake: false };
let autoGas = store.get('tvgame-autogas') === '1';
function sendCtl() { post('race/input', { l: ctl.l, r: ctl.r, gas: ctl.gas || (autoGas && !ctl.brake), brake: ctl.brake }); }
function holdButton(label, cls, keyName) {
  const b = h('button', { class: cls }, label);
  const on = e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (err) {} if (!ctl[keyName]) { ctl[keyName] = true; b.classList.add('held'); buzz(8); sendCtl(); } };
  const off = () => { if (ctl[keyName]) { ctl[keyName] = false; b.classList.remove('held'); sendCtl(); } };
  b.onpointerdown = on; b.onpointerup = off; b.onpointercancel = off; b.onlostpointercapture = off; b.oncontextmenu = e => e.preventDefault();
  return b;
}
function tapButton(label, action) {
  const b = h('button', { class: 'hit' }, label);
  b.onpointerdown = e => { e.preventDefault(); b.classList.add('held'); buzz(25); post('race/action', { action }); };
  b.onpointerup = b.onpointercancel = () => b.classList.remove('held');
  b.oncontextmenu = e => e.preventDefault();
  return b;
}
function raceController() {
  Object.keys(ctl).forEach(k => ctl[k] = false);
  const auto = h('input', { type: 'checkbox' }); auto.checked = autoGas;
  auto.onchange = () => { autoGas = auto.checked; store.set('tvgame-autogas', autoGas ? '1' : '0'); sendCtl(); };
  setTimeout(sendCtl, 0);
  return h('div', {}, h('div', { class: 'pad' }, tapButton('👊 PUNCH', 'punch'), tapButton('🦵 KICK', 'kick'),
      holdButton('◀', '', 'l'), holdButton('▶', '', 'r'), holdButton('BRAKE', 'brake', 'brake'), holdButton('GAS', 'gas', 'gas')),
    h('label', { class: 'auto' }, auto, 'Auto-accelerate (hold BRAKE to slow down)'));
}
document.addEventListener('contextmenu', e => { if (view && view.mode === 'race') e.preventDefault(); });

addEventListener('resize', () => pad && pad.size());
connect();
</script>
