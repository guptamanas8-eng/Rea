<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f3d3e">
<title>Site Manager</title>
<style>
  :root { --bg:#f3f6f5; --card:#fff; --ink:#132020; --dim:#5d6d6c; --line:#e1e8e6; --brand:#0f766e; --brand-dk:#0f3d3e; --brand-lt:#ccfbf1;
          --ok:#15803d; --ok-lt:#dcfce7; --warn:#b45309; --warn-lt:#fef3c7; --bad:#b91c1c; --bad-lt:#fee2e2; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color:var(--brand); }
  .layout { display:flex; min-height:100vh; }
  nav { width:220px; background:var(--brand-dk); color:#dbeeed; padding:18px 12px; flex:none; display:flex; flex-direction:column; gap:2px; }
  nav .logo { font-weight:800; font-size:19px; color:#fff; padding:4px 10px 4px; } nav .co { font-size:12px; opacity:.75; padding:0 10px 16px; }
  nav button { text-align:left; background:none; border:0; color:inherit; font:inherit; padding:10px 12px; border-radius:10px; cursor:pointer; }
  nav button.on, nav button:hover { background:rgba(255,255,255,.12); color:#fff; }
  nav .me { margin-top:auto; font-size:13px; opacity:.85; padding:10px; }
  main { flex:1; padding:22px 26px 60px; min-width:0; }
  h1 { font-size:22px; margin:0 0 16px; } h2 { font-size:16px; margin:22px 0 10px; }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .bar .grow { flex:1; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:12px; margin-bottom:16px; }
  .tile .n { font-size:28px; font-weight:800; } .tile .l { color:var(--dim); font-size:13px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th, td { padding:9px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; white-space:nowrap; }
  th { background:#f8faf9; font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.03em; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  tr:last-child td { border-bottom:0; } tfoot td { font-weight:800; background:#f8faf9; }
  .scroll { overflow-x:auto; border-radius:12px; }
  button, .btn { font:inherit; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:10px; padding:8px 12px; cursor:pointer; text-decoration:none; display:inline-block; }
  button.primary, .btn.primary { background:var(--brand); border-color:var(--brand); color:#fff; font-weight:700; }
  button.danger { color:var(--bad); } button.small { padding:4px 9px; font-size:13px; }
  button:disabled { opacity:.5; cursor:default; }
  input, select, textarea { font:inherit; border:1px solid #cfd9d7; border-radius:9px; padding:8px 10px; background:#fff; color:var(--ink); }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--brand-lt); border-color:var(--brand); }
  .form { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:10px 14px; }
  .form label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--dim); font-weight:600; }
  .form label.check { flex-direction:row; align-items:center; gap:8px; }
  .pill { display:inline-block; padding:2px 9px; border-radius:20px; font-size:12px; font-weight:700; }
  .pill.ok { background:var(--ok-lt); color:var(--ok); } .pill.warn { background:var(--warn-lt); color:var(--warn); } .pill.bad { background:var(--bad-lt); color:var(--bad); } .pill.dim { background:#eef2f1; color:var(--dim); }
  .grid-reg td { padding:4px 3px; text-align:center; font-size:12px; min-width:26px; cursor:pointer; }
  .grid-reg td.name { text-align:left; cursor:default; position:sticky; left:0; background:#fff; min-width:150px; }
  .m-P { background:var(--ok-lt); color:var(--ok); font-weight:700; } .m-H { background:#e0f2fe; color:#0369a1; font-weight:700; }
  .m-A { color:#9aa9a7; } .m-F { background:var(--warn-lt); color:var(--warn); font-weight:800; } .m-X { background:var(--bad-lt); color:var(--bad); }
  .flag { display:flex; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .flag img { width:54px; height:54px; object-fit:cover; border-radius:10px; background:#eee; cursor:zoom-in; }
  .flag .info { flex:1; } .flag .why { color:var(--warn); font-weight:700; font-size:13px; }
  dialog { border:0; border-radius:16px; padding:20px; max-width:min(760px, 94vw); width:100%; box-shadow:0 20px 60px rgba(0,0,0,.25); }
  dialog::backdrop { background:rgba(15,40,40,.45); }
  #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--brand-dk); color:#fff; padding:10px 18px; border-radius:12px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:50; }
  #toast.show { opacity:1; } #toast.bad { background:var(--bad); }
  .auth { max-width:400px; margin:9vh auto; }
  .auth h1 { text-align:center; } .auth .form { grid-template-columns:1fr; }
  .tabs { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; } .tabs button.on { background:var(--brand); color:#fff; border-color:var(--brand); }
  .muted { color:var(--dim); font-size:13px; }
  #print { display:none; }
  .poster { text-align:center; padding:30px; border:6px solid var(--brand-dk); border-radius:24px; max-width:640px; margin:0 auto; }
  .poster h1 { font-size:40px; margin:6px 0; } .poster img { width:340px; height:340px; } .poster .steps { text-align:left; font-size:19px; margin:16px auto 0; max-width:480px; }
  .slip { border:1px solid #999; border-radius:8px; padding:14px; margin:0 0 14px; page-break-inside:avoid; font-size:13px; }
  .slip table { border:0; } .slip td { padding:3px 6px; border:0; }
  @media (max-width: 760px) { .layout { flex-direction:column; } nav { width:auto; flex-direction:row; overflow-x:auto; padding:8px; } nav .co, nav .me { display:none; } nav .logo { padding:10px; } main { padding:16px; } }
  @media print { .layout, dialog, #toast, .auth { display:none !important; } #print { display:block; } body { background:#fff; } }
</style>
</head>
<body>
<div id="root"></div>
<div id="print"></div>
<dialog id="dlg"></dialog>
<div id="toast"></div>
<script>
// ------------------------------------------------------------------ basics
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k.startsWith('on')) el[k] = v; else if (k === 'class') el.className = v; else if (k === 'style') el.style.cssText = v;
    else if (v === true) el.setAttribute(k, ''); else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
}
let toastT;
function toast(msg, bad) { const t = $('#toast'); t.textContent = msg; t.className = 'show' + (bad ? ' bad' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.className = '', bad ? 5000 : 2200); }
async function api(path, method = 'GET', body) {
  const r = await fetch('/api' + path, { method, headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'site-manager' }, body: body === undefined ? undefined : JSON.stringify(body) });
  const j = r.headers.get('content-type', '').includes('json') ? await r.json() : await r.text();
  if (r.status === 401 && path !== '/login') { me = null; boot(); throw new Error('Please log in'); }
  if (!r.ok) { toast(j.error || 'Error ' + r.status, true); throw new Error(j.error); }
  return j;
}
const rupee = n => '₹' + Math.round(n || 0).toLocaleString('en-IN');
const today = () => new Date(Date.now() + 5.5 * 3600e3).toISOString().slice(0, 10);
const thisMonth = () => today().slice(0, 7);
const tm = iso => iso ? iso.slice(11, 16) : '—';
function field(label, input) { return h('label', {}, label, input); }
function val(form) { const o = {}; form.querySelectorAll('[name]').forEach(i => o[i.name] = i.type === 'checkbox' ? i.checked : i.value); return o; }
function modal(...kids) { const d = $('#dlg'); d.replaceChildren(...kids); d.showModal(); return d; }
function printOut(...nodes) { $('#print').replaceChildren(...nodes); setTimeout(() => window.print(), 150); }
function waLink(phone, text) { let d = String(phone || '').replace(/\D/g, ''); if (d.length === 10) d = '91' + d; return d ? `https://wa.me/${d}?text=${encodeURIComponent(text)}` : null; }

let me = null, sitesCache = [], view = 'dashboard';

// ------------------------------------------------------------------ boot, setup and login
async function boot() {
  try { me = await (await fetch('/api/me')).json(); if (me.error) me = null; } catch (e) { me = null; }
  if (!me) {
    const st = await (await fetch('/api/status')).json();
    return st.setup_needed ? setupScreen() : loginScreen(st.company);
  }
  sitesCache = await api('/sites');
  shell();
}
function authForm(title, sub, fields, button, submit) {
  const form = h('form', { class: 'form', onsubmit: async e => { e.preventDefault(); try { await submit(val(form)); boot(); } catch (err) {} } },
    ...fields, h('button', { class: 'primary', type: 'submit' }, button));
  $('#root').replaceChildren(h('div', { class: 'auth card' }, h('h1', {}, title), h('p', { class: 'muted', style: 'text-align:center' }, sub), form));
}
function setupScreen() {
  authForm('Set up Site Manager', 'Create your company and the first admin login.', [
    field('Company name', h('input', { name: 'company', required: true })), field('Your name', h('input', { name: 'name', required: true })),
    field('Email', h('input', { name: 'email', type: 'email', required: true })), field('Password (8+ characters)', h('input', { name: 'password', type: 'password', minlength: 8, required: true }))],
    'Create', b => api('/setup', 'POST', b));
}
function loginScreen(company) {
  authForm(company || 'Site Manager', 'Log in to continue.', [
    field('Email', h('input', { name: 'email', type: 'email', required: true, autocomplete: 'username' })),
    field('Password', h('input', { name: 'password', type: 'password', required: true, autocomplete: 'current-password' }))],
    'Log in', b => api('/login', 'POST', b));
}

// ------------------------------------------------------------------ layout
const VIEWS = [
  ['dashboard', 'Dashboard', true], ['attendance', 'Attendance', true], ['sites', 'Sites', true], ['workers', 'Workers', true],
  ['advances', 'Advances', false], ['payroll', 'Payroll', false], ['reports', 'Site P&L & bills', false], ['settings', 'Settings', false],
];
function shell() {
  const admin = me.role === 'admin';
  const navEl = h('nav', {}, h('div', { class: 'logo' }, 'Site Manager'), h('div', { class: 'co' }, me.company),
    VIEWS.filter(v => admin || v[2]).map(([k, label]) => h('button', { class: view === k ? 'on' : '', onclick: () => { view = k; shell(); } }, label)),
    h('div', { class: 'me' }, me.name, ' · ', me.role, h('br'), h('a', { href: '#', style: 'color:#9de0d8', onclick: async e => { e.preventDefault(); await api('/logout', 'POST'); me = null; boot(); } }, 'Log out')));
  const mainEl = h('main', {});
  $('#root').replaceChildren(h('div', { class: 'layout' }, navEl, mainEl));
  ({ dashboard, attendance, sites, workers, advances, payroll, reports, settings })[view](mainEl);
}
const siteName = id => (sitesCache.find(s => s.id === id) || {}).name || '—';
function siteSelect(name, value, allowAll) {
  return h('select', { name }, allowAll ? h('option', { value: '' }, 'All sites') : null,
    sitesCache.filter(s => s.active).map(s => h('option', { value: s.id, selected: String(s.id) === String(value) }, s.name)));
}

// ------------------------------------------------------------------ dashboard
async function dashboard(root) {
  const date = h('input', { type: 'date', value: today(), onchange: () => load() });
  const body = h('div', {});
  root.append(h('div', { class: 'bar' }, h('h1', { style: 'margin:0' }, 'Dashboard'), h('span', { class: 'grow' }), date), body);
  async function load() {
    const d = await api('/dashboard?date=' + date.value);
    const present = d.sites.reduce((s, x) => s + x.present, 0), now = d.sites.reduce((s, x) => s + x.on_site_now, 0);
    body.replaceChildren(
      h('div', { class: 'tiles' },
        h('div', { class: 'card tile' }, h('div', { class: 'n' }, `${present} / ${d.active_workers}`), h('div', { class: 'l' }, 'Workers present')),
        h('div', { class: 'card tile' }, h('div', { class: 'n' }, now), h('div', { class: 'l' }, 'On site now (not checked out)')),
        h('div', { class: 'card tile' }, h('div', { class: 'n', style: d.flagged.length ? 'color:var(--warn)' : '' }, d.flagged.length), h('div', { class: 'l' }, 'Check-ins to review')),
        h('div', { class: 'card tile' }, h('div', { class: 'n' }, rupee(d.sites.reduce((s, x) => s + x.wage_estimate, 0))), h('div', { class: 'l' }, "Today's wage bill (estimate)"))),
      h('h2', {}, 'Sites'),
      d.sites.length ? h('div', { class: 'scroll' }, h('table', {}, h('thead', {}, h('tr', {}, h('th', {}, 'Site'), h('th', { class: 'num' }, 'Present'), h('th', { class: 'num' }, 'On site now'), h('th', { class: 'num' }, 'Flagged'), h('th', { class: 'num' }, 'Wages (est.)'))),
        h('tbody', {}, d.sites.map(s => h('tr', {}, h('td', {}, s.site), h('td', { class: 'num' }, s.present), h('td', { class: 'num' }, s.on_site_now),
          h('td', { class: 'num' }, s.flagged ? h('span', { class: 'pill warn' }, s.flagged) : 0), h('td', { class: 'num' }, rupee(s.wage_estimate)))))))
        : h('p', { class: 'muted' }, 'No sites yet. Add one under Sites.'),
      h('h2', {}, 'Flagged check-ins'),
      h('div', { class: 'card' }, d.flagged.length ? d.flagged.map(f => flagRow(f, load)) : h('p', { class: 'muted', style: 'margin:0' }, 'Nothing to review. 👍')));
  }
  load();
}
function flagRow(f, reload) {
  const img = f.has_selfie ? h('img', { src: `/api/attendance/${f.id}/selfie`, alt: 'selfie', onclick: () => modal(h('img', { src: `/api/attendance/${f.id}/selfie`, style: 'max-width:100%;border-radius:12px' }), h('p', {}, h('button', { onclick: () => $('#dlg').close() }, 'Close'))) }) : h('img', { alt: '' });
  const act = review => api(`/attendance/${f.id}`, 'PUT', { review }).then(() => { toast(review === 'approved' ? 'Approved: counted for payroll' : 'Rejected: not counted'); reload(); });
  return h('div', { class: 'flag' }, img, h('div', { class: 'info' }, h('b', {}, f.name), ' ', h('span', { class: 'muted' }, f.code), h('div', { class: 'muted' }, `${f.site} · ${f.day} ${tm(f.in_time)}`), h('div', { class: 'why' }, f.flag_reason)),
    h('button', { class: 'small', onclick: () => act('approved') }, 'Approve'), h('button', { class: 'small danger', onclick: () => act('rejected') }, 'Reject'));
}

// ------------------------------------------------------------------ attendance
async function attendance(root) {
  let tab = 'today';
  const tabs = h('div', { class: 'tabs' }), body = h('div', {});
  root.append(h('h1', {}, 'Attendance'), tabs, body);
  const show = () => {
    tabs.replaceChildren(...[['today', 'Day list'], ['register', 'Monthly register'], ['mark', 'Mark attendance']].map(([k, l]) => h('button', { class: tab === k ? 'on' : '', onclick: () => { tab = k; show(); } }, l)));
    body.replaceChildren(); ({ today: dayList, register, mark: markView })[tab](body);
  };
  show();
}
async function dayList(root) {
  const date = h('input', { type: 'date', value: today(), onchange: () => load() }), out = h('div', {});
  root.append(h('div', { class: 'bar' }, date), out);
  async function load() {
    const recs = await api('/attendance?date=' + date.value);
    out.replaceChildren(recs.length ? h('div', { class: 'scroll' }, h('table', {},
      h('thead', {}, h('tr', {}, ['Worker', 'Site', 'In', 'Out', 'Distance', 'By', 'Status', 'OT hrs', 'Review', ''].map(x => h('th', {}, x)))),
      h('tbody', {}, recs.map(r => {
        const st = h('select', { onchange: () => api(`/attendance/${r.id}`, 'PUT', { status: st.value }).then(() => toast('Saved')) }, ['P', 'H', 'A'].map(x => h('option', { value: x, selected: r.status === x }, { P: 'Present', H: 'Half day', A: 'Absent' }[x])));
        const ot = h('input', { type: 'number', step: '0.5', min: 0, style: 'width:70px', placeholder: 'auto', value: r.ot_override ?? '', onchange: () => api(`/attendance/${r.id}`, 'PUT', { ot_override: ot.value }).then(() => toast('Saved')) });
        const pill = { ok: ['ok', 'OK'], flagged: ['warn', 'Flagged'], approved: ['ok', 'Approved'], rejected: ['bad', 'Rejected'] }[r.review];
        return h('tr', {}, h('td', {}, h('b', {}, r.name), ' ', h('span', { class: 'muted' }, r.code)), h('td', {}, r.site), h('td', {}, tm(r.in_time)), h('td', {}, tm(r.out_time)),
          h('td', {}, r.in_dist != null ? r.in_dist + ' m' : '—'), h('td', {}, r.method === 'qr' ? 'QR scan' : 'Supervisor'), h('td', {}, st), h('td', {}, ot),
          h('td', {}, h('span', { class: 'pill ' + pill[0], title: r.flag_reason || '' }, pill[1])),
          h('td', {}, r.selfie ? h('a', { href: `/api/attendance/${r.id}/selfie`, target: '_blank' }, 'Selfie') : ''));
      })))) : h('p', { class: 'muted' }, 'No attendance for this day.'));
  }
  load();
}
async function register(root) {
  const month = h('input', { type: 'month', value: thisMonth(), onchange: () => load() }), site = siteSelect('site', '', true), out = h('div', {});
  site.onchange = () => load();
  root.append(h('div', { class: 'bar' }, month, site, h('span', { class: 'muted' }, 'P present · H half day · F flagged · X rejected · click a day to change it')), out);
  async function load() {
    const r = await api(`/register?month=${month.value}${site.value ? '&site=' + site.value : ''}`);
    const days = Array.from({ length: r.days }, (_, i) => String(i + 1).padStart(2, '0'));
    out.replaceChildren(h('div', { class: 'scroll' }, h('table', { class: 'grid-reg' },
      h('thead', {}, h('tr', {}, h('th', { class: 'name' }, 'Worker'), days.map(d => h('th', {}, +d)), h('th', {}, 'Days'), h('th', {}, 'OT'))),
      h('tbody', {}, r.workers.map(w => {
        const g = r.grid[w.id] || {};
        let total = 0, ot = 0;
        const cells = days.map(d => {
          const c = g[d]; const mark = c ? c.mark : '';
          if (mark === 'P') total += 1; if (mark === 'H') total += 0.5; if (c) ot += c.ot || 0;
          return h('td', { class: 'm-' + (mark || 'A'), title: c && c.ot ? `OT ${c.ot} h` : '', onclick: () => cellEdit(w, `${month.value}-${d}`, c, load) }, mark || '·');
        });
        return h('tr', {}, h('td', { class: 'name' }, h('b', {}, w.name), ' ', h('span', { class: 'muted' }, w.code)), cells, h('td', {}, total), h('td', {}, ot));
      })))));
  }
  load();
}
function cellEdit(w, day, cell, reload) {
  const set = async (status) => {
    if (cell) await api(`/attendance/${cell.id}`, 'PUT', { status, review: 'approved' });
    else await api('/attendance/mark', 'POST', { site_id: w.site_id || (sitesCache[0] || {}).id, worker_ids: [w.id], date: day, status });
    $('#dlg').close(); toast('Saved'); reload();
  };
  modal(h('h2', { style: 'margin-top:0' }, `${w.name} · ${day}`), cell && cell.mark === 'F' ? h('p', { class: 'muted' }, 'This check-in was flagged. Choosing a status approves it.') : null,
    h('div', { class: 'bar' }, h('button', { onclick: () => set('P') }, 'Present'), h('button', { onclick: () => set('H') }, 'Half day'), h('button', { onclick: () => set('A') }, 'Absent'),
      cell ? h('button', { class: 'danger', onclick: async () => { await api(`/attendance/${cell.id}`, 'PUT', { review: 'rejected' }); $('#dlg').close(); reload(); } }, 'Reject') : null,
      h('span', { class: 'grow' }), h('button', { onclick: () => $('#dlg').close() }, 'Cancel')));
}
async function markView(root) {
  const site = siteSelect('site', (sitesCache.find(s => s.active) || {}).id), list = h('div', {}), date = h('input', { type: 'date', value: today() });
  root.append(h('p', { class: 'muted' }, 'For workers without a smartphone, or to correct a day. Your own location is recorded with the entry.'),
    h('div', { class: 'bar' }, site, date), list);
  const workersAll = await api('/workers');
  let gps = null;
  if (navigator.geolocation) navigator.geolocation.getCurrentPosition(p => gps = p.coords, () => {}, { enableHighAccuracy: true, timeout: 15000 });
  const draw = () => {
    const ws = workersAll.filter(w => w.active && (!w.site_id || String(w.site_id) === site.value));
    const boxes = ws.map(w => h('input', { type: 'checkbox', value: w.id }));
    const send = async (action, status) => {
      const ids = boxes.filter(b => b.checked).map(b => +b.value);
      if (!ids.length) return toast('Tick at least one worker', true);
      const r = await api('/attendance/mark', 'POST', { site_id: +site.value, worker_ids: ids, date: date.value, action, status, lat: gps && gps.latitude, lng: gps && gps.longitude });
      toast(`Marked ${r.marked} worker(s)`); boxes.forEach(b => b.checked = false);
    };
    list.replaceChildren(ws.length ? h('div', {},
      h('div', { class: 'bar' }, h('button', { onclick: () => boxes.forEach(b => b.checked = true) }, 'Select all'),
        h('button', { class: 'primary', onclick: () => send('in') }, 'Check in'), h('button', { onclick: () => send('out') }, 'Check out'),
        h('button', { onclick: () => send(null, 'H') }, 'Half day'), h('button', { class: 'danger', onclick: () => send(null, 'A') }, 'Absent')),
      h('table', {}, h('tbody', {}, ws.map((w, i) => h('tr', {}, h('td', { style: 'width:36px' }, boxes[i]), h('td', {}, h('b', {}, w.name)), h('td', { class: 'muted' }, w.code), h('td', { class: 'muted' }, w.designation))))))
      : h('p', { class: 'muted' }, 'No workers assigned to this site.'));
  };
  site.onchange = draw; draw();
}

// ------------------------------------------------------------------ sites
async function sites(root) {

  const row = (a, b, c, d) => h('tr', {}, h('td', {}, a), h('td', { class: 'num' }, b), h('td', { class: 'num' }, c), h('td', { class: 'num' }, d));

    h('table', { style: 'margin-top:12px' }, h('thead', {}, h('tr', {}, ['Description', 'Quantity', 'Rate', 'Amount'].map(x => h('th', {}, x)))),
      h('tbody', {}, row('Manpower (mandays)', s.mandays, rupee(s.bill_rate), rupee(s.mandays * s.bill_rate)),
        s.ot_hours && s.bill_ot_rate ? row('Overtime (hours)', s.ot_hours, rupee(s.bill_ot_rate), rupee(s.ot_hours * s.bill_ot_rate)) : null,
        row('Subtotal', '', '', rupee(s.bill)), row(`GST @ ${r.gst_rate}%`, '', '', rupee(s.gst)), row(h('b', {}, 'Total'), '', '', h('b', {}, rupee(s.bill + s.gst))))),
    h('p', { class: 'muted' }, 'Add your GSTIN, invoice number and bank details as your invoicing rules require.')));
}

// ------------------------------------------------------------------ settings
async function settings(root) {
  const s = await api('/settings');
  const num = (k, label) => field(label, h('input', { name: k, type: 'number', step: 'any', value: s[k] }));
  const form = h('form', { class: 'form' },
    field('Company name', h('input', { name: 'company_name', value: s.company_name })), field('Company address (on slips)', h('input', { name: 'company_address', value: s.company_address })),
    num('month_days', 'Paid days in a month'), num('shift_hours', 'Normal hours a day'), num('half_day_hours', 'Under this many hours = half day'), num('ot_multiplier', 'Overtime rate (× normal)'),
    num('pf_rate_employee', 'PF employee %'), num('pf_rate_employer', 'PF employer %'), num('eps_rate', 'EPS % (part of employer share)'),
    num('pf_wage_ceiling', 'PF wage ceiling ₹ (0 = none)'), num('eps_wage_ceiling', 'EPS/EDLI wage ceiling ₹'),
    num('esic_rate_employee', 'ESIC employee %'), num('esic_rate_employer', 'ESIC employer %'), num('esic_wage_ceiling', 'ESIC applies up to ₹/month'),
    num('gst_rate', 'GST on client bills %'), num('checkin_gap_minutes', 'Ignore repeat scans within (minutes)'),
    field('Slip language', h('select', { name: 'slip_language' }, h('option', { value: 'en', selected: s.slip_language === 'en' }, 'English'), h('option', { value: 'hi', selected: s.slip_language === 'hi' }, 'हिंदी'))));
  const users = await api('/users');
  root.append(h('h1', {}, 'Settings'),
    h('div', { class: 'card' }, h('p', { class: 'muted', style: 'margin-top:0' }, 'Statutory rates and ceilings change. Check these against the latest EPFO and ESIC notifications.'), form,
      h('div', { class: 'bar', style: 'margin-top:14px' }, h('button', { class: 'primary', onclick: async () => { await api('/settings', 'PUT', val(form)); toast('Settings saved'); me.company = form.company_name.value; } }, 'Save settings'))),
    h('h2', {}, 'People who can log in'),
    h('table', {}, h('thead', {}, h('tr', {}, ['Name', 'Email', 'Role', 'Sites', ''].map(x => h('th', {}, x)))),
      h('tbody', {}, users.map(u => h('tr', { style: u.active ? '' : 'opacity:.5' }, h('td', {}, u.name), h('td', {}, u.email), h('td', {}, u.role),
        h('td', {}, u.role === 'admin' ? 'All' : u.sites.map(siteName).join(', ') || '—'),
        h('td', {}, u.id !== me.id ? h('button', { class: 'small', onclick: async () => { await api(`/users/${u.id}`, 'PUT', { active: !u.active }); shell(); } }, u.active ? 'Deactivate' : 'Activate') : null))))),
    h('p', {}, h('button', { onclick: userForm }, '+ Add supervisor or admin')),
    h('h2', {}, 'Recent changes'), auditBox());
}
function auditBox() {
  const box = h('div', { class: 'card muted', style: 'max-height:300px;overflow:auto;font-size:13px' }, 'Loading…');
  api('/audit').then(list => box.replaceChildren(...list.map(a => h('div', {}, `${a.at.replace('T', ' ').slice(0, 16)} · ${a.user || 'worker'} · ${a.action}`))));
  return box;
}
function userForm() {
  const boxes = sitesCache.map(s => h('label', { class: 'check' }, h('input', { type: 'checkbox', value: s.id }), s.name));
  const form = h('form', { class: 'form' }, field('Name', h('input', { name: 'name', required: true })), field('Email', h('input', { name: 'email', type: 'email', required: true })),
    field('Password (8+ characters)', h('input', { name: 'password', type: 'password', minlength: 8 })),
    field('Role', h('select', { name: 'role' }, h('option', { value: 'supervisor' }, 'Supervisor (their sites only, no pay data)'), h('option', { value: 'admin' }, 'Admin (everything)'))));
  modal(h('h2', { style: 'margin-top:0' }, 'Add a login'), form, h('h2', {}, 'Sites they manage'), h('div', { class: 'form' }, boxes),
    h('div', { class: 'bar', style: 'margin-top:14px' }, h('span', { class: 'grow' }), h('button', { onclick: () => $('#dlg').close() }, 'Cancel'),
      h('button', { class: 'primary', onclick: async () => { const b = val(form); b.sites = boxes.map(l => l.firstChild).filter(i => i.checked).map(i => +i.value);
        await api('/users', 'POST', b); $('#dlg').close(); toast('Login created'); shell(); } }, 'Create')));
}

boot();
</script>
